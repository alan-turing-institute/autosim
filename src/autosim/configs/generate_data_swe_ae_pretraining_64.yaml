defaults:
  - generate_data_swe_crps_64
  - _self_

# Match the existing long-window SWE64 dataset, including its viscosity.
# Integrate in float64 and retain all 321 float32 states at t=40--120.
simulator:
  T: 120.0
  nu: 1.0e-4

# A separate representation-training pool; reuse existing held-out splits.
dataset:
  output_dir: outputs/${now:%Y-%m-%d}/swe_stochastic_64_ae_pretraining_${shortuuid:7}
  n_train: 1000
  n_valid: 0
  n_test: 0
  ensure_exact_n: true

# Beyond the original seed-0 namespaces and the extra seed-20261014 pool,
# whose reserved split/retry namespaces end at 20273016.
seed: 20280000
overwrite: false

visualize:
  enabled: false
  split: train
  overwrite: false

# Hydra records must not create or replace dataset provenance before validation.
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/swe_ae_pretraining_runs/${shortuuid:7}
