# D4 (mass pulses): forced-dissipative jet with sudden local height bumps at random
# times and places. Purpose: probabilistic skill with a forcing that is intermittent
# and local, far from Gaussian. Same climate as d4_vortical.
# Requires the "spherical" extra and a GPU; leave dataset.num_workers unset.
_target_: autosim.experimental.simulations.SphericalShallowWater
log_level: progress_bar
initial_condition: random_balanced
grid: legendre-gauss
lmax: 86
nlat: 128
nlon: 256
# Time in hours. The first 60 days are the spin-up: the eddy energy is steady after 40
# to 50 days (measured at this size). The next 15 days are saved every 3 h, 121 frames.
T: 1800.0
dt_save: 3.0
skip_nt: 480
courant: 0.4
mean_depth: 10000.0
batch_size: 8
device: cuda
return_constant_fields: true
# Climate. The height relaxes in 1 day towards the balanced height of an 80 m/s jet at
# 45 degrees north, and a drag of 100 days damps the wind. The jet is unstable, so the
# relaxation keeps regenerating eddies. Measured without forcing: jet of 54 m/s, eddy
# kinetic energy 5.0 +- 0.3 m^2/s^2, drag loss 2.4e-5 m^2/s^3.
relaxation_time: 24.0
relaxation_jet_speed: 80.0
relaxation_jet_latitude: 0.7853981633974483
drag_time: 2400.0
# Forcing: on average 1 pulse per hour somewhere on the sphere. A pulse is a Gaussian
# bump of 60 m and angular width 0.1 rad (640 km), with its global mean removed so that
# the mass is unchanged. Measured spread between members from one state, relative to
# the variability of the climate (1.41 for independent members): 0.38 for h and 0.10
# for u_phi after 1 day, 0.55 and 0.15 after 5 days. The height separates faster than
# the wind.
forcing_type: mass_pulses
pulse_rate: 1.0
pulse_amplitude: 60.0
pulse_width: 0.1
pulse_remove_mean: true
# The pulses have no memory, so the saved fields alone determine the forecast
# distribution.
branch_forcing_state: redraw
# Extra members from the first saved frame. 0 for training data; a reference ensemble
# is a run with simulator.reference_members=16 and small dataset counts.
reference_members: 0
# The initial flow only seeds the spin-up.
parameters_range:
  amp: [10.0, 30.0]
  initial_wavenumber: [4.0, 10.0]
  initial_bandwidth: [1.0, 3.0]
