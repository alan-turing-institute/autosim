# D2: Rossby-Haurwitz wave (Williamson et al. 1992, case 6), no forcing.
# Purpose: large-scale propagating waves; a whole family held out of training.
# Requires the "spherical" extra and a GPU; leave dataset.num_workers unset.
_target_: autosim.experimental.simulations.SphericalShallowWater
log_level: progress_bar
initial_condition: rossby_haurwitz
grid: legendre-gauss
lmax: 86
nlat: 128
nlon: 256
# 14 days as in W92, which reports days 0, 7 and 14. The wavenumber-4 pattern takes
# about 7 days to move by one wavelength, so 6 h between frames gives 30 frames per
# wavelength. No spin-up: the wave is the initial state.
T: 336.0
dt_save: 6.0
skip_nt: 0
courant: 0.4
# Level from which the saved h is measured, and depth of the time-step estimate.
mean_depth: 8000.0
batch_size: 8
device: cuda
return_constant_fields: true
# W92: wavenumber 4, omega = K = 7.848e-6 1/s, h_0 = 8000 m. The sampled wavenumber is
# rounded to the nearest integer, and the rounded value is saved.
parameters_range:
  wavenumber: [3.0, 6.0]
  wave_amplitude: [5.0e-6, 1.0e-5]
  mean_depth: [7000.0, 9000.0]
