# Dataset 2: one Rossby or inertia-gravity wave of Shamir and Paldor (2016) per run,
# with the divergent (momentum) forcing, which excites further gravity waves.
# Requires the "spherical" extra and a GPU; leave dataset.num_workers unset.
_target_: autosim.experimental.simulations.SphericalShallowWater
log_level: progress_bar
initial_condition: shamir_paldor
grid: legendre-gauss
lmax: 256
nlat: 384
nlon: 768
# Time in hours: 10 days, saved every hour. The fastest wave of the ranges below,
# (n, k) = (5, 8), has a period of 3.7 h.
T: 240.0
dt_save: 1.0
skip_nt: 0
courant: 0.4
# gH = 5e4 m^2/s^2, the depth of the published wave of Shamir and Paldor (2016).
mean_depth: 5098.835833802426
batch_size: 8
device: cuda
return_constant_fields: true
# Divergent forcing: energy rate [m^2/s^3], decorrelation time [h] and slope p of the
# noise amplitude l^p of Berner et al. (2009); half of the energy goes to the divergent
# pattern.
forcing_type: momentum
forcing_energy_rate: 1.0e-5
forcing_correlation_time: 6.0
forcing_spectral_slope: -1.27
forcing_divergent_fraction: 0.5
# Wave type (0 Rossby, 1 eastward, 2 westward inertia-gravity), zonal wavenumber k = 3
# to 8 and mode n = 1 to 5, rounded (half-integer bounds draw each integer equally),
# and the largest wind speed [m/s]. k >= 3 keeps every inertia-gravity wave faster
# than 2 Omega, where its structure is regular. The published wave is (n, k) = (5, 10).
parameters_range:
  wave_type: [-0.5, 2.5]
  zonal_wavenumber: [2.5, 8.5]
  mode_number: [0.5, 5.5]
  wave_amplitude: [5.0, 40.0]
