# D5 (Galewsky): the jet of Galewsky et al. (2004) solved at a fine resolution and
# saved at the coarse one. Purpose: the truth as an emulator at the coarse resolution
# sees it. The scales that the coarse grid drops act on the saved ones, so the coarse
# solver (the baseline) drifts away from this truth without any added noise.
# Requires the "spherical" extra and a GPU; leave dataset.num_workers unset.
_target_: autosim.experimental.simulations.SphericalShallowWater
log_level: progress_bar
initial_condition: galewsky
# Fine run: T170 (lmax = 171) on the 256 x 512 Gauss-Legendre grid, free of aliasing.
grid: legendre-gauss
lmax: 171
nlat: 256
nlon: 512
# Saved fields: truncated to lmax = 86 on the 128 x 256 grid, the size of D1 to D4.
output_lmax: 86
output_nlat: 128
output_nlon: 256
# Also save the run of the solver at lmax = 86 from the truncated first saved frame.
return_baseline: true
# Time as in D1: 3 h between frames, the first 183 h dropped, 60 frames kept.
T: 360.0
dt_save: 3.0
skip_nt: 61
courant: 0.4
mean_depth: 10000.0
noise_amplitude: 10.0
noise_lmax: 120
batch_size: 8
device: cuda
# Coriolis parameter and (flat) orography on the coarse grid.
return_constant_fields: true
# Ranges of D1.
parameters_range:
  jet_speed: [60.0, 100.0]
  height_perturbation_m: [60.0, 180.0]
  perturbation_lon: [0.0, 6.283185307179586]
  perturbation_lat: [0.6283185307179586, 1.0471975511965976]
