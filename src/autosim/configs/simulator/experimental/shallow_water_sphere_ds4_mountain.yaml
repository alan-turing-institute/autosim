# Dataset 4: zonal flow over an isolated mountain (Williamson et al. 1992, case 5),
# with the Gaussian mountain of DCMIP-2008 (section 1.5) in place of the cone of W92,
# and the local backscatter forcing, which returns energy where the wave train
# dissipates it.
# Requires the "spherical" extra and a GPU; leave dataset.num_workers unset.
_target_: autosim.experimental.simulations.SphericalShallowWater
log_level: progress_bar
initial_condition: mountain
grid: legendre-gauss
lmax: 256
nlat: 384
nlon: 768
# Time in hours: 15 days as in W92, saved every 6 h. No spin-up: the adjustment of
# the flow to the mountain is part of the case.
T: 360.0
dt_save: 6.0
skip_nt: 0
courant: 0.4
# h_0 of the journal version of W92 as quoted in the literature.
mean_depth: 5960.0
batch_size: 8
device: cuda
# The orography h_s and the Coriolis parameter are returned in constant_fields.
return_constant_fields: true
# Local backscatter (Berner et al. 2009, eq. 13): the energy rate is a fraction of the
# kinetic energy removed by the hyperdiffusion, as a smoothed field; the pattern has
# the decorrelation time and slope of ds3.
forcing_type: vortical
forcing_energy_rate: 0.0
forcing_correlation_time: 6.0
forcing_spectral_slope: -1.27
forcing_backscatter_fraction: 0.2
forcing_backscatter_mode: local
# One orography for every simulation: the Gaussian of DCMIP-2008 (h_0 = 2000 m,
# half-width d = 1500 km = 0.2354 rad) at the summit of W92 (longitude 3 pi/2,
# latitude pi/6). Only the flow speed varies, around the 20 m/s of W92.
parameters_range:
  flow_speed: [10.0, 30.0]
  mountain_height: [2000.0, 2000.0]
  mountain_width: [0.23543371599159973, 0.23543371599159973]
  mountain_lon: [4.71238898038469, 4.71238898038469]
  mountain_lat: [0.5235987755982988, 0.5235987755982988]
