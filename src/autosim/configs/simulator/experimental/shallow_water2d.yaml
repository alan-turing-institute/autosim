_target_: autosim.experimental.simulations.ShallowWater2D
return_timeseries: true
log_level: warning
nx: 64
ny: 64
Lx: 64.0
Ly: 64.0
T: 74.0
dt_save: 0.2
skip_nt: 50
cfl: 0.12
g: 9.81
h_mean: 1.0
# null derives sqrt(g * h_mean) / 8; use 0.0 for a non-rotating f-plane.
f0: null
nu: 0.0005
drag: 0.002
coriolis_mode: periodic_beta
dealias: true
# Options: random, balanced_random_pv, balanced_double_jet, or restart.
initial_condition: random
# null prefers mode 4 with a 1.5-mode bandwidth for balanced_random_pv.
initial_wavenumber: null
initial_bandwidth: null
parameters_range:
  amp: [0.07, 0.14]
