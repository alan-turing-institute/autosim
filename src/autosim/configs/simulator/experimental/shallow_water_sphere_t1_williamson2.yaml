# T1: steady zonal flow about a tilted axis (Williamson et al. 1992, case 2).
# Purpose: rotation test and convergence. The analytic state is steady, so every frame
# should equal the first one, and the flow at tilt alpha is the flow at tilt 0 rotated.
# The four tilts of W92 (0, 0.05, pi/2 - 0.05, pi/2) are set by the "stratify" block of
# generate_data_swe_sphere_t1.yaml. Requires the "spherical" extra and a GPU.
_target_: autosim.experimental.simulations.SphericalShallowWater
log_level: progress_bar
initial_condition: williamson2
grid: legendre-gauss
lmax: 86
nlat: 128
nlon: 256
# 5 days as in W92, one frame per day.
T: 120.0
dt_save: 24.0
skip_nt: 0
courant: 0.4
# g h_0 = 2.94e4 m^2/s^2 (W92), with g = 9.80616 m/s^2.
mean_depth: 2998.115470275786
batch_size: 4
device: cuda
# The Coriolis parameter of the tilted axis is returned in constant_fields.
return_constant_fields: true
# u_0 = 2 pi a / 12 days (W92). The tilt is overridden by the stratify block.
parameters_range:
  flow_speed: [38.61068276698372, 38.61068276698372]
  tilt: [0.0, 0.0]
