# T2: the jet of Galewsky et al. (2004) without its bump and without noise (their
# section 3). Purpose: balance test. The jet is unstable, so it stays zonal only if the
# height is in balance and the solver creates no non-zonal component.
# Requires the "spherical" extra and a GPU; leave dataset.num_workers unset.
_target_: autosim.experimental.simulations.SphericalShallowWater
log_level: progress_bar
initial_condition: galewsky_unperturbed
grid: legendre-gauss
lmax: 86
nlat: 128
nlon: 256
# 120 h as in the paper, one frame every 6 h.
T: 120.0
dt_save: 6.0
skip_nt: 0
courant: 0.4
mean_depth: 10000.0
batch_size: 4
device: cuda
return_constant_fields: true
# Published jet: 80 m/s.
parameters_range:
  jet_speed: [80.0, 80.0]
