# D4 (backscatter): forced-dissipative jet with a stochastic vorticity forcing whose
# strength follows the local dissipation of the flow (Berner et al. 2009, eq. 13).
# Purpose: probabilistic skill when the noise depends on the state. Same climate as
# d4_vortical.
# Requires the "spherical" extra and a GPU; leave dataset.num_workers unset.
_target_: autosim.experimental.simulations.SphericalShallowWater
log_level: progress_bar
initial_condition: galewsky
grid: legendre-gauss
lmax: 86
nlat: 128
nlon: 256
# Time in hours. The first 60 days are the spin-up. With the vortical forcing of
# d4_vortical the eddy energy is steady after about 25 days from the Galewsky jet; this
# forcing was not measured. The next 15 days are saved every 3 h, 121 frames.
T: 1800.0
dt_save: 3.0
skip_nt: 480
courant: 0.4
mean_depth: 10000.0
batch_size: 8
device: cuda
return_constant_fields: true
# Climate. The height relaxes in 1 day towards the balanced height of an 80 m/s jet at
# 45 degrees north, and a drag of 100 days damps the wind. The jet is unstable, so the
# relaxation keeps regenerating eddies. Measured without forcing, from the random start
# used before the Galewsky jet: jet of 54 m/s, eddy kinetic energy 5.0 +- 0.3 m^2/s^2,
# drag loss 2.4e-5 m^2/s^3.
relaxation_time: 24.0
relaxation_jet_speed: 80.0
relaxation_jet_latitude: 0.7853981633974483
drag_time: 2400.0
# Forcing. The pattern is that of d4_vortical. There is no fixed rate: the energy rate
# is a fraction of the kinetic energy that the hyperdiffusion and the drag remove, as a
# smoothed field on the sphere. Measured from the random start: mean rate 5.2e-6
# m^2/s^3, and a spread of u_phi between members from one state, relative to the
# variability of the climate (1.41 for independent members), of 0.27 after 1 day, 0.77
# after 5 days and 1.12 after 10 days.
forcing_type: vortical
forcing_energy_rate: 0.0
forcing_correlation_time: 6.0
forcing_spectral_slope: -1.27
forcing_backscatter_fraction: 0.2
forcing_backscatter_mode: local
backscatter_include_drag: true
# The pattern is redrawn at the first saved frame, so the saved fields alone determine
# the forecast distribution.
branch_forcing_state: redraw
# Extra members from the first saved frame. 0 for training data; a reference ensemble
# is a run with simulator.reference_members=16 and small dataset counts.
reference_members: 0
# The Galewsky jet only seeds the spin-up: the ranges of d1_galewsky.
parameters_range:
  jet_speed: [60.0, 100.0]
  height_perturbation_m: [60.0, 180.0]
  perturbation_lon: [0.0, 6.283185307179586]
  perturbation_lat: [0.6283185307179586, 1.0471975511965976]
