defaults:
  - simulator: experimental/shallow_water2d_crps_32
  - _self_

dataset:
  output_dir: outputs/${now:%Y-%m-%d}/swe_crps_32_${shortuuid:7}
  n_train: 4000
  n_valid: 400
  n_test: 400
  ensure_exact_n: true

seed: 0
overwrite: false

stratify:
  enabled: false
  key: null
  values: []

visualize:
  enabled: false
  split: train
  batch_indices: null
  max_examples: 4
  fps: 5
  file_ext: mp4
  overwrite: true
  preserve_aspect: true

normalization:
  shared_core_field_groups: []

hydra:
  run:
    dir: ${dataset.output_dir}
