# Datasets of the spherical shallow water benchmark.
#   autosim --config-name generate_data_swe_sphere simulator=experimental/shallow_water_sphere_ds3_galewsky
# The simulator configs are shallow_water_sphere_ds1_*.yaml to ds6_*.yaml in
# configs/simulator/experimental. Dataset 6 has 32 / 4 / 4 trajectories (PlanetSWE).
defaults:
  - simulator: experimental/shallow_water_sphere_ds3_galewsky
  - _self_

dataset:
  output_dir: outputs/${now:%Y-%m-%d}/${hydra:runtime.choices.simulator}_${shortuuid:7}
  n_train: 1000
  n_valid: 100
  n_test: 100
  ensure_exact_n: true
  # The simulator runs batch_size simulations in parallel on the GPU.
  num_workers: null

seed: 0
overwrite: false

stratify:
  enabled: false
  key: null
  values: []

# The videos draw the fields as images of (latitude, longitude). They are off by
# default; set visualize.enabled=true to write them.
visualize:
  enabled: false
  split: test
  batch_indices: null
  max_examples: 4
  fps: 5
  file_ext: mp4
  overwrite: true
  preserve_aspect: true

normalization:
  shared_core_field_groups: []

hydra:
  run:
    dir: ${dataset.output_dir}
